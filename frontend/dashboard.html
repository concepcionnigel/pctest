<!DOCTYPE html>
<html>
<body>

<button onclick="logout()">Logout</button>

<h2>Employees</h2>

<form id="form">
    <input type="hidden" id="id">

    <input id="fname" placeholder="First Name">
    <input id="mname" placeholder="Middle Name">
    <input id="lname" placeholder="Last Name">

    <button>Save</button>
</form>

<hr>

<table border="1">
    <tbody id="table"></tbody>
</table>

<script>

// Check if user is logged in
const user = JSON.parse(localStorage.getItem('user'));

if (!user) {
    window.location.href = '/';
}

// Logout
function logout() {
    localStorage.removeItem('user');
    localStorage.removeItem('token');
    window.location.href = '/';
}

const form = document.getElementById('form');

async function loadTable() {

    const res = await fetch('http://127.0.0.1:8000/api/employees');
    const data = await res.json();

    let rows = '';

    data.forEach(emp => {
        rows += `
        <tr>
            <td>${emp.fname}</td>
            <td>${emp.mname}</td>
            <td>${emp.lname}</td>
            <td>
                <button onclick="editRow(${emp.id},'${emp.fname}','${emp.mname}','${emp.lname}')">
                    Edit
                </button>

                <button onclick="deleteRow(${emp.id})">
                    Delete
                </button>
            </td>
        </tr>
        `;
    });

    document.getElementById('table').innerHTML = rows;
}

form.addEventListener('submit', async e => {

    e.preventDefault();

    const id = document.getElementById('id').value;

    const data = {
        fname: fname.value,
        mname: mname.value,
        lname: lname.value
    };

    const url = id
        ? `http://127.0.0.1:8000/api/employees/${id}`
        : 'http://127.0.0.1:8000/api/employees';

    const method = id ? 'PUT' : 'POST';

    await fetch(url, {
        method,
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    });

    form.reset();
    document.getElementById('id').value = '';

    loadTable();
});

function editRow(id, fname, mname, lname) {

    document.getElementById('id').value = id;
    document.getElementById('fname').value = fname;
    document.getElementById('mname').value = mname;
    document.getElementById('lname').value = lname;
}

async function deleteRow(id) {

    await fetch(
        `http://127.0.0.1:8000/api/employees/${id}`,
        {
            method: 'DELETE'
        }
    );

    loadTable();
}

loadTable();

</script>

</body>
</html>
